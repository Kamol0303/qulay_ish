# ====================================
# NGINX — mexrliqollar.uz (mexrliqollar.uz)
# ====================================
# File: /etc/nginx/sites-available/mexrliqollar.uz
#
# Setup:
# 1. sudo cp nginx-config.conf /etc/nginx/sites-available/mexrliqollar.uz
# 2. sudo ln -sf /etc/nginx/sites-available/mexrliqollar.uz /etc/nginx/sites-enabled/
# 3. sudo certbot --nginx -d mexrliqollar.uz -d www.mexrliqollar.uz
# 4. sudo nginx -t && sudo systemctl reload nginx

upstream qulay_ish_api {
    server 127.0.0.1:4000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name mexrliqollar.uz www.mexrliqollar.uz;
    return 301 https://ishliayol.uz$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.mexrliqollar.uz;
    ssl_certificate /etc/letsencrypt/live/mexrliqollar.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mexrliqollar.uz/privkey.pem;
    return 301 https://ishliayol.uz$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mexrliqollar.uz;

    ssl_certificate /etc/letsencrypt/live/mexrliqollar.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mexrliqollar.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    root /var/www/qulay-ish/dist;
    index index.html;

    client_max_body_size 15m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_vary on;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # NestJS API
    location /api/ {
        proxy_pass http://qulay_ish_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Public uploads served by Nest
    location /uploads/ {
        proxy_pass http://qulay_ish_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }

    access_log /var/log/nginx/mexrliqollar-access.log;
    error_log /var/log/nginx/mexrliqollar-error.log;
}
