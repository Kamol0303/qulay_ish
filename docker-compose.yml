services:
  postgres:
    image: postgres:16-alpine
    container_name: qulay_ish_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qulay_ish}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qulay_ish_dev}
      POSTGRES_DB: ${POSTGRES_DB:-qulay_ish}
    # Bound to localhost only — needed for local dev; not publicly exposed.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - qulay_ish_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qulay_ish} -d ${POSTGRES_DB:-qulay_ish}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
    container_name: qulay_ish_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      API_PORT: "4000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-qulay_ish}:${POSTGRES_PASSWORD:-qulay_ish_dev}@postgres:5432/${POSTGRES_DB:-qulay_ish}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - qulay_ish_uploads:/app/uploads

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_URL: /api
        VITE_SUPER_ADMIN_PHONE: ${VITE_SUPER_ADMIN_PHONE:-}
        VITE_SUPER_ADMIN_PASSWORD: ${VITE_SUPER_ADMIN_PASSWORD:-}
        VITE_SUPER_ADMIN_EMAIL: ${VITE_SUPER_ADMIN_EMAIL:-}
        VITE_USE_EMULATOR: "false"
        VITE_AI_MOCK_MODE: ${VITE_AI_MOCK_MODE:-false}
    container_name: qulay_ish_web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-80}:80"

volumes:
  qulay_ish_pgdata:
  qulay_ish_uploads:
