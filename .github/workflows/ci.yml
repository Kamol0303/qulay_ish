name: check

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
        working-directory: api
      - run: npx prisma generate
        working-directory: api
      - run: npx tsc --noEmit
        working-directory: api
      - run: npm test
        working-directory: api
      - run: node --import tsx --test ../src/lib/statsCounts.spec.ts
        working-directory: api
